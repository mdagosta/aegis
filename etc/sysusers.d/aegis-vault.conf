# Users and groups for aegis-vault (systemd-sysusers). Installed as /etc/sysusers.d/aegis-vault.conf,
# then: systemd-sysusers
#
# aegis-clients: may connect to read.sock (each app's user joins it, e.g. "m www-data aegis-clients").
# aegis-admin:   may connect to admin.sock (aegis-web's user, aegis-infra).
# Joining a group only opens the socket file; what a user may do is in /etc/aegis/policy.toml.
u aegis-vault - "aegis-vault secrets daemon" /var/lib/aegis-vault /usr/sbin/nologin
g aegis-clients -
g aegis-admin -
