# SSH into the dev container, for herdr on the Mac. sshd never listens: each connection is
# `docker exec -i aegis-app-1 /usr/sbin/sshd -i` from the Mac's ~/.ssh/config (dev.sh ssh-config),
# so only someone who can already run docker on the Mac gets in.
PermitRootLogin no
AllowUsers mdagosta
PasswordAuthentication no
KbdInteractiveAuthentication no
# The Mac's public key, installed here by the entrypoint from a read-only mount.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
# No SSH keys of any kind reach the container: prod access stays on the Mac host.
AllowAgentForwarding no
X11Forwarding no
